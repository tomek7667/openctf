name: Update nginx

on:
  push:
    branches:
      - master
    paths:
      - "src/nginx/**"
      - ".github/workflows/nginx.yml"
  workflow_dispatch:

jobs:
  upload:
    name: Upload nginx config
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Upload nginx config"
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: ./src/nginx/openctfapi
          target: /tmp/
          strip_components: 3

  deploy:
    name: Restart nginx
    runs-on: self-hosted
    needs: upload
    steps:
      - name: "Move nginx to the right place"
        run: |
          sudo mv /tmp/openctfapi ${{ secrets.NGINX_DIST }}
          rm -rf /tmp/openctfapi

      - name: "Restart nginx"
        run: |
          sudo systemctl restart nginx
